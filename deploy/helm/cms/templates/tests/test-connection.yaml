apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cms.fullname" . }}-test-connection"
  labels:
    {{- include "cms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
      args:
        - -qO-
        - "http://{{ include "cms.fullname" . }}:{{ .Values.service.port }}/health"

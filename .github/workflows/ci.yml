name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/app/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui/app

      - name: Build frontend
        run: npm run build
        working-directory: ui/app

      - name: Run Go checks
        run: make check

      - name: Validate Helm environments
        run: make helm-lint
